name: Build & Release Windows x64

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Sv.TimeTracker.sln

      - name: Run unit tests
        run: dotnet test Sv.TimeTracker.sln -c Release --no-restore --verbosity normal

      - name: Publish self-contained Windows x64 release
        shell: pwsh
        run: |
          dotnet publish Sv.TimeTracker\Sv.TimeTracker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --no-restore

          $publishDir = "Sv.TimeTracker\bin\Release\net10.0-windows\win-x64\SV Time Tracker"
          $zipPath = "SV-Time-Tracker-win-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipPath

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SV-Time-Tracker-win-x64
          path: SV-Time-Tracker-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SV-Time-Tracker-win-x64.zip
          generate_release_notes: true
