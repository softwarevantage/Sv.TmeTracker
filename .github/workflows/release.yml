name: Build & Release Windows x64

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$csproj = Get-Content "Sv.TimeTracker\Sv.TimeTracker.csproj"
            $ver = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
            if (-not $ver) { $ver = "1.0.0" }
          }
          "app_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore dependencies
        run: dotnet restore Sv.TimeTracker.sln

      - name: Run unit tests
        run: dotnet test Sv.TimeTracker.sln -c Release --no-restore --verbosity normal

      - name: Publish self-contained Windows x64 release
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.app_version }}"
          dotnet publish Sv.TimeTracker\Sv.TimeTracker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$ver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $publishDir = "Sv.TimeTracker\bin\Release\net10.0-windows\win-x64\SV Time Tracker"
          $zipPath = "SV-Time-Tracker-v$ver-win-x64.zip"
          Get-ChildItem -Filter "SV-Time-Tracker-*-win-x64.zip" | Remove-Item -Force
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipPath

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SV-Time-Tracker-win-x64
          path: SV-Time-Tracker-v${{ steps.version.outputs.app_version }}-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SV-Time-Tracker-v${{ steps.version.outputs.app_version }}-win-x64.zip
          generate_release_notes: true
